<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dulac Auto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Dulac Auto, école de conduite : permis B manuel et automatique, conduite accompagnée, moto, code de la route. Inscription en ligne.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,50..125,100..900;1,50..125,100..900&family=Figtree:wght@400;500;600;700&display=swap">
<style id="site-css">
/* Layout : en-tête et bandeau d'accueil toujours sombres, bandes diagonales façon livrée de course, sections alternées, panneau d'édition latéral (bas d'écran sur mobile). */
:root{
  --bg:#0A0A0C;--bg2:#111115;--surface:#18181D;--ink:#F5F5F7;--muted:#A1A1AA;--line:#2A2A31;
  --p:#E10600;--p-ink:#FFFFFF;--a:#FFFFFF;--ok:#22C55E;--err:#FF5A5F;
  --dark:#09090B;--on-dark:#F5F5F7;--on-dark-m:#A1A1AA;
  --disp:"Saira","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:inherit}
:focus-visible{outline:3px solid var(--p);outline-offset:3px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--dark)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{overflow-x:clip;transition:margin .35s var(--ease)}

/* Boutons inclinés */
.btn{--bb:var(--p);--bc:var(--p-ink);--bd:var(--p);position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 30px;border:0;background:none;color:var(--bc);font:800 italic 15px/1 var(--disp);letter-spacing:.07em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:transform .25s var(--ease)}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--bb);border:2px solid var(--bd);border-radius:2px;transform:skewX(-14deg);transition:box-shadow .3s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn:hover::before{box-shadow:0 14px 32px -12px var(--bd)}
.btn-o{--bb:transparent;--bc:currentColor;--bd:currentColor}
.btn-d{--bb:var(--dark);--bc:var(--on-dark);--bd:var(--dark)}

/* En-tête */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;color:var(--on-dark);background:color-mix(in srgb,var(--dark) 80%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.07);transition:background .3s}
.hdr.sc{background:color-mix(in srgb,var(--dark) 96%,transparent)}
.nav{display:flex;align-items:center;gap:18px;padding-block:16px;transition:padding .35s var(--ease)}
.hdr.sc .nav{padding-block:9px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;margin-right:auto;min-width:0}
.logo{width:48px;height:40px;flex:none}
.logo-img{height:42px;width:auto;max-width:130px;object-fit:contain;flex:none}
.brand b{display:block;font:900 italic 22px/1 var(--disp);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--on-dark-m);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{position:relative;display:flex;align-items:center;gap:2px}
.menu>a,.dd>a{display:flex;align-items:center;gap:6px;padding:10px 14px;font:700 italic 14px var(--disp);letter-spacing:.09em;text-transform:uppercase;text-decoration:none;color:var(--on-dark-m);transition:color .2s}
.menu a:hover,.menu a.on{color:var(--on-dark)}
.ind{position:absolute;left:0;bottom:1px;height:3px;width:0;background:var(--p);opacity:0;transform:skewX(-20deg);transition:transform .5s var(--ease),width .5s var(--ease),opacity .3s;pointer-events:none}
.dd{position:relative}
.dd svg{width:10px;height:10px;transition:transform .3s var(--ease)}
.dd:hover svg,.dd:focus-within svg{transform:rotate(180deg)}
.mega{position:absolute;top:calc(100% + 14px);left:50%;width:max-content;max-width:min(760px,90vw);display:grid;grid-template-columns:repeat(var(--n),minmax(190px,1fr));gap:26px;padding:24px;background:var(--dark);border:1px solid rgba(255,255,255,.1);border-top:3px solid var(--p);box-shadow:0 30px 60px -20px rgba(0,0,0,.7);opacity:0;visibility:hidden;transform:translate(-50%,12px);transition:opacity .25s,transform .35s var(--ease),visibility .25s}
.mega::before{content:"";position:absolute;left:0;right:0;top:-18px;height:18px}
.dd:hover .mega,.dd:focus-within .mega{opacity:1;visibility:visible;transform:translate(-50%,0)}
.mega h5{margin:0 0 8px;font:800 italic 13px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--p)}
.mega a{display:flex;justify-content:space-between;gap:18px;padding:8px 0;color:var(--on-dark);text-decoration:none;font-size:14px;border-bottom:1px solid rgba(255,255,255,.06);transition:color .2s,padding .25s var(--ease)}
.mega a span{color:var(--on-dark-m);font-variant-numeric:tabular-nums;white-space:nowrap}
.mega a:hover{color:var(--p);padding-left:6px}
.cta-top{padding:12px 22px;font-size:13px}
.burger{display:none;width:46px;height:42px;flex:none;flex-direction:column;justify-content:center;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.2);border-radius:4px;background:none;cursor:pointer}
.burger span{display:block;width:20px;height:2px;background:var(--on-dark);transition:transform .35s var(--ease)}
.burger[aria-expanded="true"] span:first-child{transform:translateY(4px) rotate(45deg)}
.burger[aria-expanded="true"] span:last-child{transform:translateY(-4px) rotate(-45deg)}
@media (max-width:960px){.menu,.cta-top{display:none}.burger{display:flex}}
.mob{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;gap:8px;overflow-y:auto;color:var(--on-dark);background:linear-gradient(115deg,transparent 68%,var(--p) 68% 80%,var(--a) 80% 81%,transparent 81%),var(--dark);padding-top:calc(100px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.mob a{font:900 italic clamp(2rem,9vw,3rem)/1.15 var(--disp);text-transform:uppercase;text-decoration:none;animation:slin .55s var(--ease) both;animation-delay:calc(var(--i)*70ms)}
.mob .btn{margin-top:22px;align-self:flex-start;font:800 italic 16px/1 var(--disp)}

/* Accueil */
.hero{position:relative;isolation:isolate;overflow:hidden;background:var(--dark);color:var(--on-dark)}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 2px,transparent 2px 7px)}
.stripes{position:absolute;inset:0;z-index:-1;background:linear-gradient(112deg,transparent 57%,var(--p) 57% 71%,var(--a) 71% 72.4%,transparent 72.4% 74.6%,var(--p) 74.6% 75.8%,transparent 75.8%)}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-block:clamp(48px,8vw,110px)}
.hero-copy{display:grid;gap:24px;min-width:0}
.k{display:inline-flex;align-items:center;gap:12px;font:700 italic 13px var(--disp);letter-spacing:.22em;text-transform:uppercase;color:var(--on-dark-m)}
.k::before{content:"";width:34px;height:4px;background:var(--p);transform:skewX(-24deg)}
.hero h1{margin:0;font:900 italic clamp(2.9rem,8vw,6.4rem)/.9 var(--disp);font-variation-settings:"wdth" 85;text-transform:uppercase;text-wrap:balance}
.hero h1 em{display:block;font-style:inherit;color:var(--p)}
.hero .lead{margin:0;max-width:56ch;font-size:1.1rem;color:var(--on-dark-m)}
.ctas{display:flex;flex-wrap:wrap;gap:16px}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.facts li{padding:6px 14px;font-size:14px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.05);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hero-art{display:grid;place-items:center;min-width:0}
.gauge{width:100%;max-width:440px;height:auto;filter:drop-shadow(0 30px 50px rgba(0,0,0,.55))}
.shot{width:100%;max-width:560px;aspect-ratio:4/3;clip-path:polygon(14% 0,100% 0,86% 100%,0 100%)}
.shot img{width:100%;height:100%;object-fit:cover}
@media (max-width:860px){
  .hero-grid{grid-template-columns:1fr}
  .gauge{max-width:300px}
  .stripes{background:linear-gradient(160deg,transparent 64%,var(--p) 64% 81%,var(--a) 81% 82.5%,transparent 82.5%)}
}
.g-bg{fill:rgba(12,12,14,.88);stroke:rgba(255,255,255,.12);stroke-width:2}
.g-ring{fill:none;stroke:rgba(255,255,255,.2);stroke-width:2}
.g-red{fill:none;stroke:var(--p);stroke-width:12}
.tk{stroke:var(--on-dark);stroke-width:4;stroke-linecap:round}
.tk2{stroke:var(--on-dark-m);stroke-width:2}
.tn{fill:var(--on-dark);font:800 italic 24px var(--disp);text-anchor:middle}
.g-u{fill:var(--on-dark-m);font:600 13px var(--body);letter-spacing:.12em;text-anchor:middle}
.g-d{fill:var(--p);font:900 italic 30px var(--disp);letter-spacing:.06em;text-anchor:middle}
.needle{transform-box:view-box;transform-origin:200px 200px;transform:rotate(118deg);animation:sweep 2.4s var(--ease) .4s both}
.needle line{stroke:var(--p);stroke-width:7;stroke-linecap:round}
.needle circle{fill:var(--on-dark);stroke:var(--p);stroke-width:4}
.ld{animation:up .8s var(--ease) both;animation-delay:calc(var(--i,0)*90ms + 80ms)}
.booted .ld,.booted .needle{animation:none}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
@keyframes slin{from{opacity:0;transform:translateX(-32px)}}
@keyframes sweep{0%{transform:rotate(0deg)}45%{transform:rotate(225deg)}60%{transform:rotate(206deg)}100%{transform:rotate(118deg)}}

/* Bandeau défilant */
.ticker{overflow:hidden;white-space:nowrap;background:var(--p);color:var(--p-ink);border-bottom:3px solid var(--dark)}
.track{display:inline-flex;padding-block:14px;animation:tick 45s linear infinite}
.track span{display:inline-flex;align-items:center;gap:44px;padding-inline:22px;font:900 italic 18px var(--disp);letter-spacing:.06em;text-transform:uppercase}
.track span::after{content:"";width:12px;height:12px;background:currentColor;opacity:.45;transform:skewX(-20deg)}
@keyframes tick{to{transform:translateX(-50%)}}

/* Sections */
.s{padding-block:clamp(64px,9vw,120px)}
.s.alt{background:var(--bg2)}
.sh{display:grid;gap:14px;max-width:760px;margin-bottom:42px}
.eb{display:inline-flex;align-items:center;gap:12px;font:800 italic 13px var(--disp);letter-spacing:.2em;text-transform:uppercase;color:var(--p)}
.eb::before{content:"";width:30px;height:4px;background:var(--p);transform:skewX(-24deg)}
h2{margin:0;font:900 italic clamp(2.1rem,5.4vw,4rem)/.95 var(--disp);font-variation-settings:"wdth" 88;text-transform:uppercase;text-wrap:balance}
h3{margin:0;font:800 italic 1.3rem/1.15 var(--disp);text-transform:uppercase;letter-spacing:.01em}
.lead{margin:0;max-width:62ch;font-size:1.08rem;color:var(--muted)}
.mu{margin:0;color:var(--muted)}
@supports (animation-timeline:view()){@media (prefers-reduced-motion:no-preference){
  .rv{animation:rv linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
  .trk i{animation:fillx linear both;animation-timeline:view();animation-range:entry 30% cover 55%}
}}
@keyframes rv{from{opacity:.12;transform:translateY(36px)}}
@keyframes fillx{from{transform:scaleX(0)}}

/* Formations */
.tabs{display:inline-flex;flex-wrap:wrap;gap:6px;max-width:100%;padding:6px;margin-bottom:28px;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.tab{padding:10px 20px;border:0;border-radius:999px;background:transparent;color:var(--muted);font:800 italic 14px var(--disp);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .35s var(--ease),color .3s}
.tab.on{background:var(--p);color:var(--p-ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{display:flex;flex-direction:column;gap:14px;min-width:0;padding:26px;background:var(--surface);border:1px solid var(--line);border-radius:6px;transition:transform .4s var(--ease),border-color .3s,box-shadow .4s}
.card:hover{transform:translateY(-6px);border-color:var(--p);box-shadow:0 28px 50px -30px var(--p)}
.card.top{border:2px solid var(--p);background:linear-gradient(160deg,color-mix(in srgb,var(--p) 15%,var(--surface)),var(--surface) 55%)}
.tag{align-self:flex-start;padding:5px 11px;background:var(--p);color:var(--p-ink);font:800 italic 11px var(--disp);letter-spacing:.14em;text-transform:uppercase;transform:skewX(-12deg)}
.card ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:15px;color:var(--muted)}
.card li{display:flex;gap:10px}
.card li::before{content:"";flex:none;width:8px;height:8px;margin-top:8px;background:var(--p);transform:skewX(-20deg)}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.price small{font-size:13px;color:var(--muted)}
.price strong{font:900 italic 2.3rem/1 var(--disp);font-variant-numeric:tabular-nums}
.card .btn{width:100%}
.cards.swap .card{animation:up .5s var(--ease) both;animation-delay:calc(var(--i)*60ms)}
.note{margin:22px 0 0;font-size:14px;color:var(--muted)}
.empty{margin:0;padding:30px;color:var(--muted);border:1px dashed var(--line);border-radius:6px}

/* Parcours */
.stw{position:relative}
.trk{position:absolute;left:0;right:0;top:34px;height:4px;overflow:hidden;background:var(--line)}
.trk i{position:absolute;inset:0;background:var(--p);transform-origin:left}
.steps{position:relative;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:28px}
.steps li{display:grid;gap:10px;align-content:start;min-width:0}
.sn{width:72px;height:72px;display:grid;place-items:center;margin-bottom:6px;background:var(--dark);color:var(--on-dark);border:3px solid var(--p);font:900 italic 28px var(--disp);transform:skewX(-10deg)}
.steps p{margin:0;font-size:15px;color:var(--muted)}
@media (max-width:900px){.trk{display:none}}

/* Financement */
.fin{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.fi{display:grid;gap:10px;align-content:start;padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:6px;transition:transform .35s var(--ease),border-color .3s}
.fi:hover{transform:translateY(-4px);border-color:var(--p)}
.fi b{font:900 italic 2rem/1 var(--disp);color:var(--p);text-transform:uppercase;overflow-wrap:anywhere}
.fi p{margin:0;font-size:15px;color:var(--muted)}

/* Inscription */
.ins{display:grid;grid-template-columns:.85fr 1.15fr;gap:40px;align-items:start}
.ins .sh{margin:0}
@media (max-width:920px){.ins{grid-template-columns:1fr}}
.docs{display:grid;gap:14px;padding:28px;background:var(--dark);color:var(--on-dark);border-left:5px solid var(--p);border-radius:6px}
.docs ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:15px;color:var(--on-dark-m)}
.docs li{display:flex;gap:10px}
.docs li::before{content:"✓";color:var(--p);font-weight:700}
.fm{display:grid;gap:18px;padding:clamp(20px,3vw,34px);background:var(--surface);border:1px solid var(--line);border-radius:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
.fd{display:grid;gap:6px;min-width:0}
.fd>span,.lg{padding:0;font-size:14px;font-weight:600}
.lg{margin-bottom:8px}
.fm input,.fm select,.fm textarea{width:100%;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:4px;transition:border-color .2s,box-shadow .2s}
.fm input:focus,.fm select:focus,.fm textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 22%,transparent)}
.fm fieldset{margin:0;padding:0;border:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:15px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;transition:border-color .2s,background .2s}
.fm .chips input{width:auto;margin:0;accent-color:var(--p)}
.chips label:has(input:checked){border-color:var(--p);background:color-mix(in srgb,var(--p) 13%,transparent)}
.est{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;background:var(--bg);border-left:4px solid var(--p)}
.est strong{font:900 italic 1.7rem var(--disp);font-variant-numeric:tabular-nums}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
.fm .consent input{width:auto;margin-top:4px;accent-color:var(--p)}
.err{margin:0;font-size:14px;font-weight:600;color:var(--err)}
.hp{position:absolute!important;left:-9999px;width:1px!important;height:1px;opacity:0;pointer-events:none}
.fm{position:relative}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.recap{display:grid;gap:14px;padding:26px;background:var(--surface);border:2px solid var(--ok);border-radius:6px;animation:up .5s var(--ease)}
.recap h3{color:var(--ok)}
.recap p{margin:0}
.recap dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0}
.recap dt{color:var(--muted)}
.recap dd{margin:0;min-width:0;font-weight:600;overflow-wrap:anywhere}
.demo{padding-top:10px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line)}

/* Contact */
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.cb{display:grid;gap:10px;align-content:start;padding:26px;background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.cb p{margin:0}
.big{font:900 italic 1.7rem var(--disp);font-variant-numeric:tabular-nums;user-select:all;overflow-wrap:anywhere}
.sel{user-select:all;overflow-wrap:anywhere}
.hrs{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:15px;font-variant-numeric:tabular-nums}
.hrs dt{color:var(--muted)}
.hrs dd{margin:0}

/* Recrutement et pied de page */
.hire{position:relative;isolation:isolate;overflow:hidden;background:var(--p);color:var(--p-ink)}
.hire::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(112deg,transparent 72%,var(--dark) 72% 80%,var(--a) 80% 81%,transparent 81%)}
.hire .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:24px;padding-block:50px}
.hire h2{font-size:clamp(1.6rem,3.6vw,2.6rem)}
.hire p{margin:8px 0 0;opacity:.9}
.foot{padding-block:44px;font-size:14px;background:var(--dark);color:var(--on-dark-m)}
.foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px}
.foot strong{color:var(--on-dark)}
.foot nav{display:flex;flex-wrap:wrap;gap:8px 20px}
.foot a{color:var(--on-dark-m)}
.foot a:hover{color:var(--on-dark)}

/* Panneau de modification */
#fab{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;gap:8px;padding:13px 20px;border:0;border-radius:999px;background:#111114;color:#F2F2F4;font:700 15px var(--body);box-shadow:0 14px 30px -8px rgba(0,0,0,.55),0 0 0 2px var(--p);cursor:pointer;transition:transform .25s var(--ease)}
#fab:hover{transform:translateY(-2px)}

const AK="dulac-admin-session",sbBase=()=>S.backend.url.replace(/\/+$/,"");

async function admToken(){
  const a=getAdm();if(!a||!a.s||!a.s.refresh_token||!sbReady())return null;let x=a.s;
  if(Date.now()>=(x.expires_at||0)-60000){
    const r=await fetch(sbBase()+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:sbHeaders(),body:JSON.stringify({refresh_token:x.refresh_token})});
    if(!r.ok)return null;const j=await r.json();
    x={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000,email:x.email};
    try{(a.keep?localStorage:sessionStorage).setItem(AK,JSON.stringify(x))}catch(e){}
  }
  return x.access_token;
}
async function loadRemote(){
  if(inClaude||!sbReady())return;
  try{
    const r=await fetch(sbBase()+"/rest/v1/site_config?id=eq.1&select=data,updated_at",{headers:sbHeaders()});
    if(!r.ok)return;const j=await r.json();if(!j[0]||!j[0].data)return;
    const keep=S.backend;S=j[0].data;migrate();if(!S.backend||!S.backend.url)S.backend=keep;

async function publishRemote(){

  try{

    const r=await fetch(sbBase()+"/rest/v1/site_config?on_conflict=id",{method:"POST",headers:Object.assign(sbHeaders(tok),{Prefer:"resolution=merge-duplicates,return=representation"}),body:JSON.stringify({id:1,data:S})});

    if(r.status===413){toast("Le site est trop lourd : utilisez des images plus légères.");return}
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();PUB=JSON.stringify(S);PUB_REV=j[0]&&j[0].updated_at;clearDraft();updStatus();

function readImg(file,max,fmt,cb){
  if(!file||!/^image\//.test(file.type)){toast("Ce fichier n'est pas une image. Utilisez un PNG, un JPG ou un SVG.");return}
  if(file.type==="image/svg+xml"){if(file.size>300000){toast("SVG trop lourd : 300 Ko maximum.");return}const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file);return}

  im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);cb(fmt==="png"?c.toDataURL("image/png"):c.toDataURL("image/jpeg",.84))};
  im.onerror=()=>{URL.revokeObjectURL(url);toast("Impossible de lire cette image.")};
  im.src=url;

async function publish(){

      :c==="rate_limited"?"Trop de publications rapprochées : réessayez dans une minute."

  if(d.base===PUB_REV){S=d.s;migrate();render();updStatus();toast("Vos modifications non publiées ont été restaurées.")}
  else toast("Un brouillon plus ancien existe sur cet appareil.","Le restaurer",()=>{snap();S=d.s;migrate();changed(true)});
}
function enableEdit(open){
  if(!EDIT){EDIT=true;buildShell();restoreDraft()}
  if(open)openEd(true);
}

/* ---------- Démarrage ---------- */
migrate();render();
setTimeout(()=>document.documentElement.classList.add("booted"),3000);
const startEdit=()=>{if(location.hash==="#edition")enableEdit(true);else if(!inClaude&&getAdm())enableEdit(false)};
if(inClaude)startEdit();else loadRemote().finally(startEdit);
addEventListener("hashchange",()=>{if(location.hash==="#edition")enableEdit(true)});
if(inClaude){(async()=>{
  try{
    const [a,u,d]=await Promise.all([window.claude.use("artifact"),window.claude.use("user"),window.claude.use("downloads")]);
    ART=a;DL=d;let ce=false;
    try{ce=u?await u.canEdit():false}catch(e){}
    if(ce)enableEdit(false);
    updFoot();
  }catch(e){}
})()}
})();
</script>
